<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKU Page</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <script type="py" src="main.py"></script>

    <style>

    body{
        background-color: beige ;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

     #title{
        background-color: white;

        border: 2px black solid;

        text-align: center;
    }


    #form{
        background-color: white;

        border: 2px black solid;

        margin-top: 10px;
        margin-inline: 500px;

        padding: 30px;
    }

    .input{
        border: 1px solid black;

        padding: 10px;

        
    }




   </style>

</head>
<body>

    <div id="title">
        <h1>SKU Generator</h1>
    </div>

    <div id="form">
        <form>
            <div class="input"><label for="category">Category</label><br>
                <select id="category" name="category"> 
                    <option value="pasta">Pasta</option>
                    <option value="bread">Bread</option>
                </select>
            </div>

            <br><br>


            <div class="input"><label for="item">Item</label><br>
            <input id="item" placeholder="Item Name" type="text">
        </div>

            <br><br>

            <div class="input"><label for="quantity">Stock Quantity</label><br>
            <input id="quantity" placeholder="Place Stock Quantity" type="text">
            </div>

            <br><br>

            <div class="input"><input type="button" py-click="SKU_generator" value="Check SKU Number"></div>


        </form>

        <h3 id="sku_number"></h3>
    </div>
    
</body>
</html>
