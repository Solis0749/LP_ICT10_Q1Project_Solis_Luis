<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrep Fair Menu</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <script type="py" src="main.py"></script>

   <style>

    body{
        background-color: beige ;
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }

    #title{
        background-color: white;

        border: 2px black solid;

        text-align: center;
    }

    #menu{
        background-color: white;

        border: 1px solid black;

        margin-top: 10px;
        margin-inline: 500px;


        text-align: center;
    }

    #form{
        background-color: white;

        border: 1px solid black;

        margin-inline: 500px;

        padding: 30px;

        text-align: justify;
    }

    .input{
        border: 1px solid black;
        border-radius: 20px;

        padding: 10px;
    }

    #submit{
        background-color: rgb(2, 174, 2);
        color: white;
        padding: 5px;
    }






   </style>

</head>
<body>

    <div id="title">
        <h1>Italian Food is Good</h1>
    </div>

    <div id="menu">
        <h1>Menu</h1>
    </div>

    <div id="form">
        <form>
            <div class="input"><input id="item1" value="150" type="checkbox"> Aglio Olio Pasta ₱150</div> <br>
            <div class="input"><input id="item2" value="150" type="checkbox"> Carbonara Pasta ₱150</div> <br>
            <div class="input"><input id="item3" value="250" type="checkbox"> Lasagna ₱250 </div><br>
            <div class="input"><input id="item4" value="90" type="checkbox"> Mozzarella Sticks ₱90</div> <br>
            <div class="input"><input id="item5" value="65" type="checkbox"> Garlic Bread ₱65</div> <br><br>

            <input type="button" py-click="create_order" value="Create Receipt" id="submit"> 
        </form>
        <h4 id="receipt"></h4>

        <a href="sku.html">Check SKU Number</a>
    </div>
    
</body>
</html>
